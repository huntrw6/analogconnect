openapi: 3.1.0
info:
  title: AnalogConnect Local Control API
  version: 1.0.0
  description: Privacy-safe local health, status, and aggregate contact contract.
servers:
  - url: http://127.0.0.1:8787
    description: Loopback development server only
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Daemon process health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/status:
    get:
      operationId: getStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current independent subsystem states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /api/v1/contacts/summary:
    get:
      operationId: getContactSummary
      security:
        - bearerAuth: []
      description: Returns aggregate synchronization metadata and never contact names or numbers.
      responses:
        "200":
          description: Privacy-safe local contact summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSummary"
  /api/v1/messages/summary:
    get:
      operationId: getMessageSyncSummary
      security:
        - bearerAuth: []
      description: Returns synchronization health without addresses, handles, or message bodies.
      responses:
        "200":
          description: Privacy-safe MAP synchronization summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSyncSummary"
  /api/v1/messages:
    post:
      operationId: sendMessage
      security:
        - bearerAuth: []
      description: Sends one transient SMS through iPhone MAP without retaining or echoing its content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundMessage"
      responses:
        "202":
          description: The MAP transport accepted the send operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "422":
          description: Recipient or body validation failed without echoing input.
        "502":
          description: MAP transport failed with a redacted error.
  /api/v1/audio/summary:
    get:
      operationId: getAudioBridgeSummary
      security:
        - bearerAuth: []
      description: Returns queue and latency counters without audio samples.
      responses:
        "200":
          description: Privacy-safe bidirectional audio bridge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioBridgeSummary"
  /api/v1/audio/sessions:
    post:
      operationId: createAudioSession
      security:
        - bearerAuth: []
      description: Issues one short-lived media credential only while a call and SCO transport are active.
      responses:
        "201":
          description: One-time transient media enrollment material; clients must not persist or log it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSessionResponse"
        "409":
          description: No active call with an active SCO transport.
        "429":
          description: The authenticated mutation quota is exhausted.
  /api/v1/calls/commands:
    post:
      operationId: executeCallCommand
      security:
        - bearerAuth: []
      description: Executes one validated HFP command through WirePlumber without returning private call data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCommand"
      responses:
        "202":
          description: WirePlumber accepted the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallCommandResponse"
        "422":
          description: Command arguments failed validation without being echoed.
        "502":
          description: WirePlumber was unavailable or rejected the command.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Locally provisioned high-entropy token; never log or commit it.
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, protocol_version, daemon_version, uptime_seconds]
      properties:
        status:
          const: ok
        protocol_version:
          const: 1
        daemon_version:
          type: string
        uptime_seconds:
          type: integer
          minimum: 0
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - bluetooth
        - messages
        - contacts
        - hfp_control
        - call
        - audio
        - android_client
        - last_error
      properties:
        protocol_version:
          const: 1
        bluetooth:
          enum: [disconnected, connecting, connected, services_resolved, error]
        messages:
          enum: [idle, syncing, backing_off, error]
        contacts:
          enum: [idle, syncing, backing_off, error]
        hfp_control:
          enum:
            - disconnected
            - acl_connected
            - services_resolved
            - profile_registered
            - rfcomm_connecting
            - rfcomm_connected
            - slc_negotiating
            - slc_ready
            - error
        call:
          enum: [idle, incoming, outgoing, active, held, ended, error]
        audio:
          enum:
            - inactive
            - codec_negotiating
            - sco_connecting
            - sco_active
            - sco_tearing_down
            - error
        android_client:
          enum: [disconnected, connecting, enrolled, authenticated, error]
        last_error:
          oneOf:
            - $ref: "#/components/schemas/RedactedError"
            - type: "null"
    RedactedError:
      type: object
      additionalProperties: false
      required: [code, summary]
      properties:
        code:
          type: string
        summary:
          type: string
          description: Privacy-safe operator-facing summary; never raw backend data.
    ContactSummary:
      type: object
      additionalProperties: false
      required: [contact_count, phone_count, last_sync_unix_seconds]
      properties:
        contact_count:
          type: integer
          minimum: 0
        phone_count:
          type: integer
          minimum: 0
        last_sync_unix_seconds:
          description: Unix timestamp for the last successful full-snapshot sync.
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
    MessageSyncSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - mode
        - successful_syncs
        - failed_syncs
        - last_success_unix_seconds
      properties:
        state:
          enum: [idle, syncing, backing_off, error]
        mode:
          enum: [notifications, polling]
        successful_syncs:
          type: integer
          minimum: 0
        failed_syncs:
          type: integer
          minimum: 0
        last_success_unix_seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
    OutboundMessage:
      type: object
      additionalProperties: false
      required: [recipient, body]
      properties:
        recipient:
          type: string
          minLength: 3
          maxLength: 32
        body:
          type: string
          minLength: 1
          maxLength: 2000
    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          const: true
    CallCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              enum: [answer, reject, hang_up]
        - type: object
          additionalProperties: false
          required: [action, target]
          properties:
            action:
              const: dial
            target:
              type: string
              minLength: 1
              maxLength: 32
        - type: object
          additionalProperties: false
          required: [action, tone]
          properties:
            action:
              const: send_dtmf
            tone:
              type: string
              minLength: 1
              maxLength: 1
    CallCommandResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          const: true
    AudioQueueSummary:
      type: object
      additionalProperties: false
      required: [depth, enqueued, dequeued, dropped, max_observed_latency_micros]
      properties:
        depth:
          type: integer
          minimum: 0
        enqueued:
          type: integer
          minimum: 0
        dequeued:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
        max_observed_latency_micros:
          type: integer
          minimum: 0
    AudioBridgeSummary:
      type: object
      additionalProperties: false
      required: [uplink, downlink]
      properties:
        uplink:
          $ref: "#/components/schemas/AudioQueueSummary"
        downlink:
          $ref: "#/components/schemas/AudioQueueSummary"
    MediaSessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, token, lifetime_seconds]
      properties:
        session_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Single-session bearer credential that must never be persisted or logged.
        lifetime_seconds:
          type: integer
          minimum: 1
          maximum: 300

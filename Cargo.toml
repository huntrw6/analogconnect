[workspace]
members = [
    "crates/analogconnect-core",
    "crates/analogconnectd",
]
resolver = "2"
exclude = ["vendor/imsg-map", "vendor/imsg-session", "vendor/imsg-store"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["tls12"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
unicode-casefold = "0.2"
unicode-normalization = "0.1"

[patch.crates-io]
imsg-store = { path = "vendor/imsg-store" }
